<script>
const S = window.SCENES.scenes;
// start time of the n-th occurrence of a word in scene s (0-based scene index)
const at = (s, w, n = 1) => S[s].words.filter((x) => x[0] === w)[n - 1][1];
const tl = gsap.timeline({ paused: true });
const lead = 0.1;

// camera pans between scenes
for (let i = 1; i < S.length; i++) Doodle.pan(tl, "#sheet", i, S[i].start - 0.3);

// 1 hook
Doodle.write(tl, "#s1-title", 0.15);
Doodle.draw(tl, "#s1-mark", at(0, "ai") + 0.1, 0.4);
Doodle.draw(tl, "#s1-bubble", at(0, "answer") - lead, 0.5);
Doodle.draw(tl, "#s1-arrow", at(0, "questions") - lead, 0.3);
Doodle.draw(tl, "#s1-bot", at(0, "questions") + 0.2, 0.55);

// 2 data
Doodle.write(tl, "#s2-title", S[1].start + 0.15);
Doodle.draw(tl, "#s2-doc", at(1, "millions") - lead, 0.4);
Doodle.draw(tl, "#s2-img", at(1, "examples") - lead, 0.4);
Doodle.draw(tl, "#s2-chat", at(1, "examples") + 0.35, 0.4);
Doodle.draw(tl, "#s2-arrows", at(1, "thats") - lead, 0.4);
Doodle.write(tl, "#s2-label", at(1, "data") - lead, 0.3);
Doodle.draw(tl, "#s2-mark", at(1, "data") + 0.1, 0.3);

// 3 pattern
Doodle.write(tl, "#s3-title", S[2].start + 0.15);
Doodle.draw(tl, "#s3-nodes", at(2, "data") - lead, 0.6);
Doodle.draw(tl, "#s3-lines", at(2, "looks") - lead, 0.5);
Doodle.draw(tl, "#s3-mark", at(2, "patterns") + 0.05, 0.4);
Doodle.write(tl, "#s3-ex", at(2, "which") - lead);
Doodle.write(tl, "#s3-note", at(2, "come") - lead);

// 4 guess
Doodle.write(tl, "#s4-title", S[3].start + 0.15);
Doodle.write(tl, "#s4-q", at(3, "ask") - lead);
Doodle.draw(tl, "#s4-mark", at(3, "predicts") + 0.1, 0.3);
Doodle.write(tl, ["#s4-l1", "#s4-l2", "#s4-l3"], at(3, "most") - 0.3, 0.3);
Doodle.draw(tl, "#s4-b1", at(3, "likely") - lead, 0.4);
Doodle.draw(tl, "#s4-b2", at(3, "answer") - lead, 0.2);
Doodle.draw(tl, "#s4-b3", at(3, "answer") + 0.15, 0.2);
Doodle.pop(tl, ["#s4-p1", "#s4-p2", "#s4-p3"], at(3, "word") - lead);
Doodle.draw(tl, "#s4-ring", at(3, "by"), 0.4);

// 5 outro
Doodle.write(tl, "#s5-title", S[4].start + 0.15);
Doodle.draw(tl, "#s5-brain", at(4, "think") - lead, 0.5);
Doodle.draw(tl, "#s5-cross", at(4, "do") - lead, 0.3);
Doodle.draw(tl, "#s5-target", at(4, "it") - lead, 0.6);
Doodle.write(tl, "#s5-line", at(4, "makes") - lead);
Doodle.draw(tl, "#s5-mark", at(4, "smart") + 0.05, 0.4);


window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
