<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Manim example</title>
<script src="assets/gsap.min.js"></script>
<script src="assets/MorphSVGPlugin.min.js"></script>
<script src="assets/motion.js"></script>
<script src="assets/manim.js"></script>
<script src="scenes.js"></script>
<link rel="stylesheet" href="assets/theme.css">
</head><body>
<div id="main" class="stage" data-composition-id="main" data-start="0" data-duration="8" data-width="1080" data-height="1920">

  <div id="s1" class="layer clip" data-start="0" data-duration="8" data-track-index="0"><div id="push1" class="layer">
  <svg id="sv1" class="layer" width="1080" height="1920">
    <text id="t1a" x="540" y="330" text-anchor="middle" font-size="120"></text>
    <text id="t1b" x="540" y="470" text-anchor="middle" font-size="120"></text>
    <g id="in"><path id="c-in" class="shape" stroke="var(--blue)" d="M540 580 C606 580 660 634 660 700 C660 766 606 820 540 820 C474 820 420 766 420 700 C420 634 474 580 540 580 Z"/>
      <text id="q" x="540" y="748" text-anchor="middle" font-size="140"></text></g>
    <g id="a1"><path class="shape" stroke="var(--white)" d="M540 840 L540 925"/><path fill="var(--white)" stroke="none" d="M540 945 L524 919 L556 919 Z"/></g>
    <path id="morph" class="shape" stroke="var(--blue)" style="opacity:0" d="M540 580 C606 580 660 634 660 700 C660 766 606 820 540 820 C474 820 420 766 420 700 C420 634 474 580 540 580 Z"/>
    <path id="sq" d="M390 960 L690 960 L690 1250 L390 1250 Z" style="display:none"/>
    <g id="aibox"><text id="ai" x="540" y="1158" text-anchor="middle" font-size="150"></text></g>
    <g id="a2"><path class="shape" stroke="var(--white)" d="M540 1270 L540 1345"/><path fill="var(--white)" stroke="none" d="M540 1365 L524 1339 L556 1339 Z"/></g>
    <g id="out"><path id="c-out" class="shape" stroke="var(--green)" d="M540 1375 C584 1375 620 1411 620 1455 C620 1499 584 1535 540 1535 C496 1535 460 1499 460 1455 C460 1411 496 1375 540 1375 Z"/>
      <text id="ex" x="540" y="1495" text-anchor="middle" font-size="110"></text></g>
  </svg></div></div>

  <div id="s2" class="layer clip" data-start="0" data-duration="8" data-track-index="1"><div id="push2" class="layer"><div id="punch2" class="layer">
  <svg id="sv2" class="layer" width="1080" height="1920">
    <text id="t2a" x="540" y="330" text-anchor="middle" font-size="96"></text>
    <text id="t2b" x="540" y="450" text-anchor="middle" font-size="88"></text>
    <text id="neq" x="520" y="595" text-anchor="end" font-size="80"></text>
    <text id="num" x="540" y="595" font-size="80" style="fill:var(--yellow);stroke:none">0</text>
    <g id="grid"></g>
    <path id="brace" class="shape" stroke="var(--white)" stroke-width="6" d="M122 1282 Q122 1308 152 1308 L510 1308 Q540 1308 540 1340 Q540 1308 570 1308 L928 1308 Q958 1308 958 1282"/>
    <text id="lab" x="540" y="1470" text-anchor="middle" font-size="130"></text>
  </svg></div></div></div>

  <audio id="vo" src="assets/vo-8s.m4a" data-start="0" data-duration="7.5" data-track-index="10" data-volume="1"></audio>
  <audio id="bed" src="assets/bed-8s.m4a" data-start="0" data-duration="8" data-track-index="11" data-volume="1"></audio>
  <audio id="sfx" src="assets/sfx.wav" data-start="0" data-duration="8" data-track-index="12" data-volume="0.35"></audio>
</div>
<script>
const S = window.SCENES.scenes;
const at = (s, w, n = 1) => S[s].words.filter((x) => x[0] === w)[n - 1][1];
const tl = gsap.timeline({ paused: true });
const M = Motion, X = Manim;

// ---- scene 1: question -> AI -> answer (vertical flow) ----
M.push(tl, "#push1", 0, S[1].start - 0.3, 1.04);
X.write(tl, "#t1a", [["How does ", null], ["AI", "#58c4dd"]], 0.05);
X.write(tl, "#t1b", [["answer?", null]], at(0, "answer") - 0.1, 0.03);
X.create(tl, "#c-in", at(0, "answer"), 0.55);
X.write(tl, "#q", [["?", "#58c4dd"]], at(0, "answer") + 0.24, 0, 0.4);
tl.to("#q", { rotation: -12, transformOrigin: "50% 70%", duration: 0.25, ease: X.SMOOTH, yoyo: true, repeat: 3 }, at(0, "your")); // secondary wobble
X.growArrow(tl, "#a1", at(0, "your"), "down");
X.transform(tl, "#morph", "#sq", at(0, "questions"), 0.7, "#f7d96f");
M.sfx("swish", at(0, "questions"), { dur: 0.6, gain: 0.5 });
X.write(tl, "#ai", [["AI", "#f7d96f"]], at(0, "questions") + 0.4, 0.06, 0.35);
X.indicate(tl, "#aibox", at(0, "questions") + 0.8);
X.growArrow(tl, "#a2", at(0, "questions") + 0.55, "down");
X.create(tl, "#c-out", at(0, "questions") + 0.7, 0.4);
X.write(tl, "#ex", [["!", "#83c167"]], at(0, "questions") + 0.85, 0, 0.3);
M.squash(tl, "#out", at(0, "questions") + 1.0);
X.fadeOutUp(tl, "#s1", S[1].start - 0.28);
M.sfx("whoosh", S[1].start - 0.1, { gain: 0.5 });

// ---- scene 2: millions of examples -> data ----
M.push(tl, "#push2", S[1].start, 7.5, 1.04);
X.write(tl, "#t2a", [["AI learns from", null]], S[1].start, 0.025);
X.write(tl, "#t2b", [["millions", "#f7d96f"], [" of examples", null]], at(1, "from") - 0.02, 0.025);
const NS = "http://www.w3.org/2000/svg", grid = document.querySelector("#grid"), dots = [];
for (let r = 0; r < 9; r++) for (let c = 0; c < 12; c++) {
  const d = document.createElementNS(NS, "circle");
  d.setAttribute("cx", 122 + c * 76); d.setAttribute("cy", 690 + r * 70); d.setAttribute("r", 14); d.setAttribute("fill", "#58c4dd");
  grid.appendChild(d); dots.push(d);
}
// LaggedStart(FadeIn) from the centre
tl.from(dots, { scale: 0, opacity: 0, transformOrigin: "50% 50%", duration: 0.35, ease: "back.out(2)", stagger: { each: 0.005, grid: [9, 12], from: "center" } }, at(1, "millions"));
M.punch(tl, "#punch2", at(1, "millions"), 1.04);
// DecimalNumber
X.write(tl, "#neq", [["N", "#ece9e1"], [" =", null]], at(1, "millions") + 0.02, 0.04, 0.3);
tl.from("#num", { opacity: 0, duration: 0.2 }, at(1, "millions") + 0.07);
M.counter(tl, "#num", 0, 1000000, at(1, "millions") + 0.07, 0.75, (v) => Math.round(v).toLocaleString("en-US") + "+", "typing");
// ApplyWave on "examples", twice for life
[0, 0.55].forEach((d) => tl.to(dots, { y: -16, duration: 0.18, ease: "sine.out", yoyo: true, repeat: 1, stagger: { each: 0.008, grid: [9, 12], from: "start", axis: "x" } }, at(1, "examples") + d));
// they become one thing: recolour, brace, label, circumscribe
tl.to(dots, { fill: "#f7d96f", duration: 0.4, ease: X.SMOOTH, stagger: { each: 0.003, from: "center" } }, at(1, "thats"));
X.create(tl, "#brace", at(1, "called"), 0.35);
X.write(tl, "#lab", [["data", "#f7d96f"]], at(1, "data"), 0.06, 0.4);
M.punch(tl, "#punch2", at(1, "data") + 0.05, 1.05);
X.circumscribe(tl, "#sv2", [96, 664, 888, 600], at(1, "data") + 0.35);
M.sfx("chime", at(1, "data") + 0.05);

window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body></html>
