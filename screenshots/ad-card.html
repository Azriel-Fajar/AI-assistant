<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1080px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #0a0a0a;
  }

  .ad {
    width: 1080px;
    height: 1080px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }

  /* Background: portfolio mockup collage */
  .bg {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    opacity: 0.45;
    filter: blur(1px);
  }

  .bg img {
    width: 100%;
    height: 540px;
    object-fit: cover;
    object-position: top;
  }

  /* Dark gradient overlay */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.1) 0%,
      rgba(0,0,0,0.4) 40%,
      rgba(0,0,0,0.92) 75%,
      rgba(0,0,0,0.98) 100%
    );
  }

  /* Accent bar */
  .accent {
    position: absolute;
    top: 0;
    left: 0;
    width: 8px;
    height: 100%;
    background: linear-gradient(to bottom, #4f8ef7, #1a5fd4);
  }

  /* Content */
  .content {
    position: relative;
    z-index: 10;
    padding: 72px 80px 72px 88px;
  }

  .tag {
    display: inline-block;
    background: #4f8ef7;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 20px;
    border-radius: 4px;
    margin-bottom: 32px;
  }

  h1 {
    color: #ffffff;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 28px;
    letter-spacing: -1px;
  }

  h1 span {
    color: #4f8ef7;
  }

  p {
    color: #c8d4e8;
    font-size: 30px;
    line-height: 1.55;
    margin-bottom: 52px;
    max-width: 820px;
  }

  .cta {
    display: inline-block;
    background: #4f8ef7;
    color: #fff;
    font-size: 28px;
    font-weight: 700;
    padding: 22px 52px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .brand {
    position: absolute;
    top: 48px;
    right: 64px;
    z-index: 10;
    height: 48px;
    opacity: 0.95;
  }
</style>
</head>
<body>
<div class="ad">

  <!-- Background images -->
  <div class="bg">
    <img src="parallaxnet-ca-20260529-210724.png" alt="">
    <img src="parallaxnet-id-20260529-210732.png" alt="">
  </div>

  <!-- Gradient overlay -->
  <div class="overlay"></div>

  <!-- Left accent bar -->
  <div class="accent"></div>

  <!-- Brand logo top right -->
  <img class="brand" src="C:/xampp/htdocs/Rielcode/IMG/Rielcode Logo Transparent.png" alt="Rielcode">

  <!-- Main content -->
  <div class="content">
    <div class="tag">Free Consultation</div>
    <h1>Your competitors<br>are online.<br><span>Are you?</span></h1>
    <p>If customers can't find you, they're finding someone else.<br>Get a professional website built in 7 days.</p>
    <div class="cta">Get Your Free Consultation</div>
  </div>

</div>
</body>
</html>
