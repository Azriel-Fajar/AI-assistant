<!DOCTYPE html>
<html>
<head><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script></head>
<body>
<div x-data="{items: []}">
  <button id="add" @click="items.push({id: Date.now(), msg:'hi'})">add</button>
  <template x-for="t in items" :key="t.id">
    <div class="toast" x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 -translate-y-4" x-transition:enter-end="opacity-100 translate-y-0">
      <span x-text="t.msg"></span>
    </div>
  </template>
</div>
</body>
</html>
